
    

<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Charles Aranna - Cyber Tech Group</title>
  
<style>

    :root {
      --bg-dark: #040810;
      --header-bg: rgba(8, 14, 24, 0.85);
      --cyan-neon: #00F0FF;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --chrome-text: #E2E8F0;
      --border-color: rgba(0, 240, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--chrome-text);
    }

    /* Cabeçalho Principal */

    .cyber-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7), 0 1px 15px var(--cyan-glow);
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 2rem;
    }

    /* Identidade / Logo */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-svg {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 0 6px var(--cyan-neon));
      transition: transform 0.3s ease;
    }

    .brand-logo:hover .logo-svg {
      transform: scale(1.05);
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 0%, #A0AEC0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--cyan-neon);
      text-shadow: 0 0 8px var(--cyan-glow);
    }

    /* Navegação */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-link {
      text-decoration: none;
      color: var(--chrome-text);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      padding: 0.5rem 0;
      transition: color 0.3s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--cyan-neon);
      box-shadow: 0 0 8px var(--cyan-neon);
      transition: width 0.3s ease;
    }

    .nav-link:hover {
      color: var(--cyan-neon);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    /* Botão do Portal */
    .btn-portal {
      text-decoration: none;
      color: var(--cyan-neon);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.6rem 1.4rem;
      border: 1px solid var(--cyan-neon);
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.05);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
      transition: all 0.3s ease;
    }

    .btn-portal:hover {
      background: var(--cyan-neon);
      color: #000000;
      box-shadow: 0 0 20px var(--cyan-neon);
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .nav-menu {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header class="cyber-header">
    <div class="header-container">
      
      <!-- Marca + Logo SVG Integrada -->
      <a href="#" class="brand-logo">
        <svg class="logo-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="50%" stop-color="#707B8C"/>
              <stop offset="100%" stop-color="#1A202C"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <circle cx="400" cy="400" r="360" fill="#080E18" stroke="url(#chrome)" stroke-width="20"/>
          <circle cx="400" cy="400" r="320" fill="none" stroke="#00F0FF" stroke-width="6" filter="url(#glow)"/>
          <!-- Monograma CA -->
          <path d="M 310,250 L 190,250 L 120,350 L 190,450 L 310,450" fill="none" stroke="url(#chrome)" stroke-width="35" stroke-linecap="square"/>
          <path d="M 400,250 L 320,450 L 380,450 L 400,400 L 460,400 L 480,450 L 540,450 L 460,250 Z" fill="url(#chrome)"/>
          <path d="M 310,250 L 190,250 L 120,350 L 190,450 L 310,450" fill="none" stroke="#00F0FF" stroke-width="8" filter="url(#glow)"/>
        </svg>
        <div class="brand-info">
          <span class="brand-title">Charles Aranna</span>
          <span class="brand-subtitle">Cyber Tech Group</span>
        </div>
      </a>

      <!-- Menu de Navegação -->
      <nav>
        <ul class="nav-menu">
          <li><a href="#inicio" class="nav-link">Início</a></li>
          <li><a href="#solucoes" class="nav-link">Soluções</a></li>
          <li><a href="#seguranca" class="nav-link">Segurança</a></li>
          <li><a href="#sobre" class="nav-link">Sobre</a></li>
        </ul>
      </nav>

      <!-- Ação Principal -->
      <a href="#portal" class="btn-portal">Área Restrita</a>

    </div>
  </header>

</body>
</html>
